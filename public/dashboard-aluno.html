<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Área do Aluno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-4">
                <div class="card p-3 shadow">
                    <h5>Enviar Nova Atividade</h5>
                    <form action="/enviar-atividade" method="POST" enctype="multipart/form-data">
                        <input type="file" name="arquivo" class="form-control mb-2" required>
                        <button type="submit" class="btn btn-primary w-100">Enviar</button>
                    </form>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card p-3 shadow">
                    <h5>Meu Histórico</h5>
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Arquivo</th>
                                <th>Status</th>
                                <th>Nota</th>
                                <th>Feedback</th>
                            </tr>
                        </thead>
                        <tbody id="minhasAtividades"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        fetch('/aluno/minhas-atividades').then(r => r.json()).then(dados => {
            document.getElementById('minhasAtividades').innerHTML = dados.map(atv => `
                <tr>
                    <td>${atv.nome_arquivo}</td>
                    <td>${atv.corrigido ? '✅' : '⏳'}</td>
                    <td>${atv.nota !== null ? atv.nota : '-'}</td>
                    <td><small>${atv.feedback || '-'}</small></td>
                </tr>
            `).join('');
        });
    </script>
</body>
</html>
