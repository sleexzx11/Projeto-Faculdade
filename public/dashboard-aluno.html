<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Aluno | Portal Acadêmico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; }
        
        .profile-container { position: absolute; top: 20px; right: 20px; z-index: 1000; }
        .profile-img { 
            width: 50px; height: 50px; border-radius: 50%; object-fit: cover; 
            border: 2px solid rgba(255,255,255,0.8); cursor: pointer; transition: transform 0.2s;
        }
        .profile-img:hover { transform: scale(1.1); border-color: #fff; }

        .user-info-header {
            padding: 15px;
            background-color: #f8f9fa;
            border-bottom: 1px solid #eee;
            border-radius: 8px 8px 0 0;
        }

        .hero-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; padding: 60px 0 90px 0; border-bottom-left-radius: 50px;
            border-bottom-right-radius: 50px; margin-bottom: -50px; position: relative;
        }

        .card { border: none; border-radius: 15px; }
        .status-badge { border-radius: 20px; padding: 5px 12px; font-size: 0.8rem; }
        .bg-success-soft { background-color: #dcfce7; color: #166534; border: 1px solid #86efac; }
        .bg-warning-soft { background-color: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }

        .btn-download-aluno {
            background-color: #f1f5f9;
            color: #475569;
            border: none;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 8px;
            text-decoration: none;
            display: inline-block;
            margin-top: 8px;
            transition: 0.2s;
        }
        .btn-download-aluno:hover { background-color: #e2e8f0; color: #1e293b; }
    </style>
</head>
<body>

    <header class="hero-section shadow-lg">
        <div class="profile-container">
            <div class="dropdown">
                <img src="https://ui-avatars.com/api/?name=Aluno&background=random" 
                     alt="Perfil" class="profile-img dropdown-toggle" 
                     data-bs-toggle="dropdown" id="userPhoto">
                <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2 p-0" style="min-width: 220px;">
                    <div class="user-info-header">
                        <div class="fw-bold text-dark text-truncate" id="menuNome">Carregando...</div>
                        <div class="text-muted small" id="menuRA">RA: --</div>
                    </div>
                    <li><label class="dropdown-item mt-2" style="cursor:pointer">📸 Alterar Foto <input type="file" hidden onchange="changePhoto(this)"></label></li>
                    <li><a class="dropdown-item" href="#" onclick="abrirModalSenha()">🔑 Alterar Senha</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <!-- ROTA DE LOGOUT ATUALIZADA -->
                    <li><a class="dropdown-item text-danger fw-bold" href="/auth/logout">Deslogar</a></li>
                </ul>
            </div>
        </div>

        <div class="container text-center">
            <h1 class="fw-bold">Central de Atividades 📚</h1>
            <p class="lead opacity-75">Olá, <span id="welcomeNome">Aluno</span>! Acompanhe suas entregas.</p>
        </div>
    </header>

    <div class="container py-5">
        <div class="row g-4">
            <div class="col-lg-4">
                <div class="card shadow p-4 mt-5 border-top border-primary border-4">
                    <h5 class="fw-bold mb-3">🚀 Novo Envio</h5>
                    <form action="/enviar-atividade" method="POST" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label class="form-label text-muted small">Selecione o arquivo (PDF, DOCX, etc)</label>
                            <input type="file" name="arquivo" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold py-2 shadow-sm">Entregar Atividade</button>
                    </form>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card shadow p-4 mt-5">
                    <h5 class="fw-bold mb-4">📊 Meu Desempenho</h5>
                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Atividade</th>
                                    <th>Status</th>
                                    <th>Nota</th>
                                    <th>Feedback</th>
                                </tr>
                            </thead>
                            <tbody id="minhasAtividades"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL SENHA -->
    <div class="modal fade" id="modalSenha" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-sm modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold">Alterar Senha 🔑</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label small">Nova Senha</label>
                        <input type="password" id="novaSenha" class="form-control" oninput="validarSenhas()">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small">Confirmar Senha</label>
                        <input type="password" id="confirmarSenha" class="form-control" oninput="validarSenhas()">
                        <div id="feedbackSenha" class="small mt-1 d-none"></div>
                    </div>
                    <button id="btnSalvarSenha" class="btn btn-primary w-100 fw-bold" onclick="salvarNovaSenha()" disabled>Atualizar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Carrega dados do Perfil (Rota unificada no backend)
        async function carregarDadosPerfil() {
            try {
                const response = await fetch('/api/perfil');
                if (response.ok) {
                    const dados = await response.json();
                    document.getElementById('menuNome').innerText = dados.nome;
                    document.getElementById('welcomeNome').innerText = dados.nome;
                    document.getElementById('menuRA').innerText = "RA: " + (dados.ra || "N/A");
                    document.getElementById('userPhoto').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(dados.nome)}&background=random`;
                } else {
                    window.location.href = '/login.html'; // Redireciona se não estiver logado
                }
            } catch (error) {
                console.error("Erro ao carregar perfil:", error);
            }
        }

        function carregarMinhasAtividades() {
            fetch('/aluno/minhas-atividades')
                .then(r => r.json())
                .then(dados => {
                    const tbody = document.getElementById('minhasAtividades');
                    if(!dados || dados.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">Nenhuma atividade enviada.</td></tr>';
                        return;
                    }
                    tbody.innerHTML = dados.map(atv => `
                        <tr>
                            <td>
                                <div class="fw-bold">${atv.nome_arquivo}</div>
                                <div class="text-muted small">Enviado em: ${new Date(atv.data_envio).toLocaleDateString()}</div>
                                <a href="/uploads/${atv.caminho_arquivo}" download="${atv.nome_arquivo}" class="btn-download-aluno">
                                    📥 Baixar meu arquivo
                                </a>
                            </td>
                            <td>
                                <span class="badge ${atv.corrigido ? 'bg-success-soft' : 'bg-warning-soft'} status-badge">
                                    ${atv.corrigido ? '✅ Corrigido' : '⏳ Em Análise'}
                                </span>
                            </td>
                            <td><span class="fs-5 fw-bold ${atv.nota >= 6 ? 'text-success' : 'text-danger'}">${atv.nota !== null ? atv.nota : '--'}</span></td>
                            <td><p class="mb-0 small text-secondary">${atv.feedback || 'Sem feedback'}</p></td>
                        </tr>
                    `).join('');
                })
                .catch(err => console.error("Erro ao carregar atividades"));
        }

        function changePhoto(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => document.getElementById('userPhoto').src = e.target.result;
                reader.readAsDataURL(input.files[0]);
            }
        }

        function abrirModalSenha() {
            const myModal = new bootstrap.Modal(document.getElementById('modalSenha'));
            myModal.show();
        }

        function validarSenhas() {
            const s1 = document.getElementById('novaSenha').value;
            const s2 = document.getElementById('confirmarSenha').value;
            const f = document.getElementById('feedbackSenha');
            const b = document.getElementById('btnSalvarSenha');
            f.classList.remove('d-none');
            
            if (s1.length < 4) {
                f.innerHTML = "⚠️ Mínimo 4 caracteres";
                f.className = "small mt-1 text-warning";
                b.disabled = true;
            } else if(s1 === s2) {
                f.innerHTML = "✅ Senhas coincidem";
                f.className = "small mt-1 text-success";
                b.disabled = false;
            } else {
                f.innerHTML = "❌ Senhas não batem";
                f.className = "small mt-1 text-danger";
                b.disabled = true;
            }
        }

        async function salvarNovaSenha() {
            const novaSenha = document.getElementById('novaSenha').value;
            try {
                const response = await fetch('/auth/trocar-senha', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ novaSenha })
                });
                
                const result = await response.json();
                if (response.ok) {
                    alert("Senha alterada com sucesso!");
                    bootstrap.Modal.getInstance(document.getElementById('modalSenha')).hide();
                } else {
                    alert("Erro: " + result.erro);
                }
            } catch (err) {
                alert("Erro ao conectar com o servidor.");
            }
        }

        // Iniciar
        carregarDadosPerfil();
        carregarMinhasAtividades();
    </script>
</body>
</html>
