<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel do Professor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow p-4">
            <h3>Trabalhos para Corrigir</h3>
            <table class="table table-hover mt-3">
                <thead>
                    <tr>
                        <th>Aluno</th>
                        <th>Arquivo</th>
                        <th>Status</th>
                        <th>Nota</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="listaAtividades"></tbody>
            </table>
        </div>
    </div>

    <script>
        function carregar() {
            fetch('/atividades/lista').then(r => r.json()).then(dados => {
                document.getElementById('listaAtividades').innerHTML = dados.map(atv => `
                    <tr>
                        <td>${atv.nome_aluno}</td>
                        <td><a href="/uploads/${atv.caminho_arquivo}" target="_blank">📄 ${atv.nome_arquivo}</a></td>
                        <td>${atv.corrigido ? '<span class="badge bg-success">Corrigido</span>' : '<span class="badge bg-warning text-dark">Pendente</span>'}</td>
                        <td>${atv.nota !== null ? atv.nota : '-'}</td>
                        <td>
                            <button onclick="corrigir(${atv.id})" class="btn btn-sm btn-primary">Lançar Nota</button>
                        </td>
                    </tr>
                `).join('');
            });
        }

        function corrigir(id) {
            const nota = prompt("Nota (0-10):");
            const feedback = prompt("Feedback:");
            if (nota !== null) {
                fetch('/atividades/corrigir', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ id, nota: nota.replace(',','.'), feedback })
                }).then(() => carregar());
            }
        }
        carregar();
    </script>
</body>
</html>
