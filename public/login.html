<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso ao Sistema | Portal Acadêmico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            --accent-color: #3b82f6;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f3f4f7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }

        .bg-decoration {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--primary-gradient);
            clip-path: circle(30% at 100% 0%);
            z-index: -1;
        }

        .auth-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            padding: 40px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .brand-logo {
            font-size: 1.8rem;
            font-weight: 800;
            color: #1e3a8a;
            margin-bottom: 5px;
        }

        .form-label { font-weight: 600; font-size: 0.85rem; color: #4b5563; }

        .form-control, .form-select {
            border-radius: 12px;
            padding: 12px 15px;
            border: 2px solid #f3f4f7;
            background-color: #f9fafb;
        }

        .form-control:focus { border-color: var(--accent-color); box-shadow: none; background: white; }

        .btn-auth {
            background: var(--primary-gradient);
            border: none; border-radius: 12px;
            padding: 12px; font-weight: 700; color: white;
            transition: all 0.3s;
        }

        .btn-auth:hover { transform: translateY(-2px); box-shadow: 0 8px 15px rgba(30, 58, 138, 0.2); color: white; }

        .switch-link { color: var(--accent-color); text-decoration: none; font-weight: 600; cursor: pointer; }

        .role-selector {
            display: flex; gap: 10px; margin-bottom: 20px;
        }
        .role-option {
            flex: 1; text-align: center; padding: 10px;
            border: 2px solid #f3f4f7; border-radius: 10px;
            cursor: pointer; transition: all 0.2s; font-weight: 600;
        }
        input[type="radio"]:checked + .role-option {
            border-color: var(--accent-color);
            background: #eff6ff; color: var(--accent-color);
        }

        .hidden { display: none; }

        #avisoProfessor {
            background-color: #fffbeb;
            border: 1px solid #fef3c7;
            color: #92400e;
            padding: 10px;
            border-radius: 10px;
            font-size: 0.75rem;
            margin-bottom: 15px;
        }

        .modal-content { border-radius: 20px; border: none; }
        .modal-header { border-bottom: none; }
        .modal-footer { border-top: none; }

        /* Estilo para a sugestão de e-mail */
        .email-suggestion {
            font-size: 0.8rem;
            color: #4b5563;
            background: #fdf2f2;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #fee2e2;
            margin-top: 5px;
        }
        .email-suggestion a {
            color: #1e3a8a;
            font-weight: 700;
            text-decoration: underline;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="bg-decoration"></div>

    <!-- MODAL DE NOTIFICAÇÃO (POP-UP) -->
    <div class="modal fade" id="modalErro" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold text-danger" id="modalTitulo">Atenção</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center py-4">
                    <div id="modalIcone" class="mb-3" style="font-size: 3rem;">⚠️</div>
                    <p id="modalMensagem" class="fs-6 text-muted"></p>
                </div>
                <div class="modal-footer justify-content-center">
                    <button type="button" class="btn btn-auth px-5" data-bs-dismiss="modal">Entendido</button>
                </div>
            </div>
        </div>
    </div>

    <!-- SEÇÃO DE LOGIN -->
    <div class="auth-card" id="loginCard">
        <div class="text-center mb-4">
            <div class="brand-logo">Portal Acadêmico</div>
            <p class="text-muted small">Entre com suas credenciais</p>
        </div>

        <form action="/auth/login" method="POST">
            <div class="mb-3">
                <label class="form-label">E-mail</label>
                <input type="email" name="email" class="form-control" placeholder="seu@email.com" required>
            </div>
            <div class="mb-4">
                <label class="form-label">Senha</label>
                <input type="password" name="senha" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-auth w-100">Acessar Sistema</button>
        </form>

        <div class="text-center mt-4">
            <span class="text-muted small">Ainda não tem acesso?</span>
            <a class="switch-link small" onclick="toggleAuth()">Criar Conta</a>
        </div>
    </div>

    <!-- SEÇÃO DE REGISTRO -->
    <div class="auth-card hidden" id="registerCard">
        <div class="text-center mb-4">
            <div class="brand-logo">Novo Registro</div>
            <p class="text-muted small">Selecione seu perfil e preencha os dados</p>
        </div>

        <form action="/auth/register" method="POST">
            <div class="role-selector">
                <label class="w-100">
                    <input type="radio" name="tipo" value="aluno" class="hidden" checked onchange="toggleCampos('aluno')">
                    <div class="role-option">Aluno 🎓</div>
                </label>
                <label class="w-100">
                    <input type="radio" name="tipo" value="professor" class="hidden" onchange="toggleCampos('professor')">
                    <div class="role-option">Professor 👨‍🏫</div>
                </label>
            </div>

            <div id="avisoProfessor" class="hidden text-center">
                ⚠️ Para se cadastrar como professor, seu e-mail deve estar previamente autorizado pela administração.
            </div>

            <div class="mb-3">
                <label class="form-label">Nome Completo</label>
                <input type="text" name="nome" class="form-control" placeholder="Ex: João Silva" required>
            </div>

            <div id="camposExtrasAluno">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">RA</label>
                        <input type="text" name="ra" class="form-control" placeholder="123456">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Turma</label>
                        <input type="text" name="turma" class="form-control" placeholder="3º A">
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">E-mail</label>
                <input type="email" name="email" id="emailRegistro" class="form-control" placeholder="contato@escola.com" required>
                <!-- ÁREA DE SUGESTÃO MAILCHECK -->
                <div id="sugestaoEmail" class="email-suggestion hidden">
                    Você quis dizer <a id="emailSugestaoLink"></a>?
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">Senha</label>
                <input type="password" name="senha" class="form-control" placeholder="Crie uma senha" required>
            </div>

            <button type="submit" class="btn btn-auth w-100">Registrar e Entrar</button>
        </form>

        <div class="text-center mt-4">
            <span class="text-muted small">Já é cadastrado?</span>
            <a class="switch-link small" onclick="toggleAuth()">Fazer Login</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const bootstrapModal = new bootstrap.Modal(document.getElementById('modalErro'));

        // --- LÓGICA DE VERIFICAÇÃO DE EMAIL (ESTILO MAILCHECK) ---
        const dominiosPopulares = ['gmail.com', 'hotmail.com', 'outlook.com', 'yahoo.com', 'icloud.com', 'uol.com.br', 'bol.com.br'];
        const inputEmail = document.getElementById('emailRegistro');
        const areaSugestao = document.getElementById('sugestaoEmail');
        const linkSugestao = document.getElementById('emailSugestaoLink');

        inputEmail.addEventListener('blur', function() {
            const email = this.value.trim().toLowerCase();
            if (!email.includes('@')) return;

            const [usuario, dominio] = email.split('@');
            
            // Procura um domínio similar na lista
            const sugestao = dominiosPopulares.find(d => {
                // Se o domínio for ligeiramente diferente (ex: gnail vs gmail)
                return d !== dominio && (dominio.startsWith(d.substring(0, 3)) || d.startsWith(dominio.substring(0, 3)));
            });

            if (sugestao) {
                const emailSugerido = `${usuario}@${sugestao}`;
                linkSugestao.innerText = emailSugerido;
                areaSugestao.classList.remove('hidden');
                
                linkSugestao.onclick = function() {
                    inputEmail.value = emailSugerido;
                    areaSugestao.classList.add('hidden');
                };
            } else {
                areaSugestao.classList.add('hidden');
            }
        });

        function exibirAviso(titulo, mensagem, icone = '⚠️') {
            document.getElementById('modalTitulo').innerText = titulo;
            document.getElementById('modalMensagem').innerText = mensagem;
            document.getElementById('modalIcone').innerText = icone;
            bootstrapModal.show();
        }

        function toggleAuth() {
            document.getElementById('loginCard').classList.toggle('hidden');
            document.getElementById('registerCard').classList.toggle('hidden');
        }

        function toggleCampos(tipo) {
            const campos = document.getElementById('camposExtrasAluno');
            const aviso = document.getElementById('avisoProfessor');
            const raInput = document.getElementsByName('ra')[0];
            const turmaInput = document.getElementsByName('turma')[0];

            if (tipo === 'professor') {
                campos.classList.add('hidden');
                aviso.classList.remove('hidden');
                raInput.required = false;
                turmaInput.required = false;
            } else {
                campos.classList.remove('hidden');
                aviso.classList.add('hidden');
            }
        }

        window.onload = function() {
    const urlParams = new URLSearchParams(window.location.search);
    const erro = urlParams.get('erro');

    if (erro) {
        // Se for erro de cadastro, alterna para a tela de registro automaticamente
        if (['email_nao_autorizado', 'email_ja_cadastrado', 'ra_duplicado'].includes(erro)) {
            toggleAuth();
        }

        switch (erro) {
            case 'ra_duplicado':
                exibirAviso("RA já cadastrado", "Este número de RA já pertence a outro aluno no sistema. Verifique os dados ou entre em contato com a secretaria.", "🆔");
                break;
                
            case 'email_ja_cadastrado':
                exibirAviso("E-mail em uso", "Este e-mail já possui um cadastro ativo no portal.", "📧");
                break;

            case 'email_nao_autorizado':
                document.querySelector('input[value="professor"]').checked = true;
                toggleCampos('professor');
                exibirAviso("Acesso Negado", "Este e-mail não consta na lista de professores autorizados.", "🚫");
                break;

            case 'usuario_nao_encontrado':
                exibirAviso("Login Inválido", "Usuário não encontrado. Verifique seu e-mail.", "🔍");
                break;

            case 'senha_incorreta':
                exibirAviso("Erro de Senha", "A senha digitada está incorreta.", "🔑");
                break;

            case 'interno':
                exibirAviso("Erro Técnico", "Ocorreu uma falha no servidor. Tente novamente mais tarde.", "⚙️");
                break;
        }

        // Limpa a URL para o erro não reaparecer ao atualizar a página
        window.history.replaceState({}, document.title, window.location.pathname);
    }
};
    </script>
</body>
</html>
